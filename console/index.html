<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allys Console — Desktop Console for Field-Sales Oversight</title>
<meta name="description" content="Desktop console for the AllysAI Sales Companion: manager oversight, analytics, coaching review, medical affairs, pharmacovigilance, compliance and configuration.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230B6E75'/%3E%3Cpath%20d='M20%2044L32%2018l12%2026'%20stroke='white'%20stroke-width='5'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   ALLYS CONSOLE — DESIGN SYSTEM
   Subject: pharmaceutical field-sales oversight (regulated back-office)
   Palette: cool blue-biased slate neutrals + petrol-teal brand accent.
   Semantic status colours are reserved and separate from the accent.
   ============================================================ */
:root{
  /* --- brand / accent (Allys petrol teal) --- */
  --brand:#0B6E75; --brand-600:#0A616A; --brand-500:#12909A; --brand-400:#1FA9B4;
  --brand-tint:#E4F1F2; --brand-tint-2:#D2E8EA;
  /* --- neutrals: slate with a slight blue bias (chosen, not default) --- */
  --ink:#101822; --ink-2:#31404F; --muted:#5C6C7C; --faint:#8A99A7;
  --line:#E2E8EC; --line-2:#EDF1F4; --line-strong:#CDD6DD;
  --bg:#F4F6F8; --panel:#FFFFFF; --panel-2:#FAFBFC; --panel-3:#F1F4F6;
  --rail:#0E1922; --rail-2:#13232E; --rail-line:#22333F; --rail-ink:#C6D3DB; --rail-muted:#7E93A0;
  /* --- status (reserved; never used as chart-series identity) --- */
  --good:#1F8A57; --good-bg:#E4F3EA; --good-line:#B7E0C6;
  --warn:#B4740B; --warn-bg:#FBF0DC; --warn-line:#EFD7A6;
  --crit:#C43B33; --crit-bg:#FBE7E5; --crit-line:#F1C3BE;
  --info:#2C64C9; --info-bg:#E6EEFB; --info-line:#BFD3F4;
  --viol:#6C4FD1; --viol-bg:#EDE8FB; --viol-line:#D3C7F2;   /* competitive */
  --pv:#B01E63;  --pv-bg:#FBE6F0;  --pv-line:#F0BAD5;        /* pharmacovigilance */
  /* --- data-viz categorical (fixed order; validated, always with legend+labels) --- */
  --c1:#0E9BA6; --c2:#6C5CE7; --c3:#E0932F; --c4:#3BA776; --c5:#3B7DD8; --c6:#D65CA8;
  --grid:#EAEEF1; --axis:#B7C1C9;
  /* --- geometry --- */
  --r-xs:4px; --r-sm:6px; --r-md:9px; --r-lg:13px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(16,24,34,.06),0 1px 3px rgba(16,24,34,.04);
  --sh-2:0 4px 12px rgba(16,24,34,.10),0 2px 4px rgba(16,24,34,.06);
  --sh-3:0 18px 44px rgba(16,24,34,.18);
  --rail-w:250px; --top-h:56px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root{
  --ink:#E7EDF1; --ink-2:#C0CCD5; --muted:#93A2AE; --faint:#6E7E8B;
  --line:#243441; --line-2:#1D2A35; --line-strong:#324453;
  --bg:#0B1218; --panel:#121C24; --panel-2:#0F1820; --panel-3:#182530;
  --rail:#0A131A; --rail-2:#0E1A22; --rail-line:#1E2E39; --rail-ink:#B7C6D0; --rail-muted:#6C7F8C;
  --good-bg:#123324; --good-line:#1E5138; --warn-bg:#3A2B0E; --warn-line:#6B4E12;
  --crit-bg:#3A1613; --crit-line:#6E2620; --info-bg:#122544; --info-line:#274a86;
  --viol-bg:#221A46; --viol-line:#3d2f77; --pv-bg:#37102a; --pv-line:#6a1f4b;
  --brand-tint:#0d2a2c; --brand-tint-2:#10393c;
  --grid:#1E2C37; --axis:#3A4C5A;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.5); --sh-3:0 20px 48px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ink:#E7EDF1; --ink-2:#C0CCD5; --muted:#93A2AE; --faint:#6E7E8B;
  --line:#243441; --line-2:#1D2A35; --line-strong:#324453;
  --bg:#0B1218; --panel:#121C24; --panel-2:#0F1820; --panel-3:#182530;
  --rail:#0A131A; --rail-2:#0E1A22; --rail-line:#1E2E39; --rail-ink:#B7C6D0; --rail-muted:#6C7F8C;
  --good-bg:#123324; --good-line:#1E5138; --warn-bg:#3A2B0E; --warn-line:#6B4E12;
  --crit-bg:#3A1613; --crit-line:#6E2620; --info-bg:#122544; --info-line:#274a86;
  --viol-bg:#221A46; --viol-line:#3d2f77; --pv-bg:#37102a; --pv-line:#6a1f4b;
  --brand-tint:#0d2a2c; --brand-tint-2:#10393c;
  --grid:#1E2C37; --axis:#3A4C5A;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.5); --sh-3:0 20px 48px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --ink:#101822; --ink-2:#31404F; --muted:#5C6C7C; --faint:#8A99A7;
  --line:#E2E8EC; --line-2:#EDF1F4; --line-strong:#CDD6DD;
  --bg:#F4F6F8; --panel:#FFFFFF; --panel-2:#FAFBFC; --panel-3:#F1F4F6;
  --brand-tint:#E4F1F2; --brand-tint-2:#D2E8EA;
  --good-bg:#E4F3EA; --good-line:#B7E0C6; --warn-bg:#FBF0DC; --warn-line:#EFD7A6;
  --crit-bg:#FBE7E5; --crit-line:#F1C3BE; --info-bg:#E6EEFB; --info-line:#BFD3F4;
  --viol-bg:#EDE8FB; --viol-line:#D3C7F2; --pv-bg:#FBE6F0; --pv-line:#F0BAD5;
  --grid:#EAEEF1; --axis:#B7C1C9;
  --sh-1:0 1px 2px rgba(16,24,34,.06),0 1px 3px rgba(16,24,34,.04);
  --sh-2:0 4px 12px rgba(16,24,34,.10),0 2px 4px rgba(16,24,34,.06);
  --sh-3:0 18px 44px rgba(16,24,34,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--brand-tint-2);color:var(--ink)}
:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono)}

/* ---------------- APP SHELL ---------------- */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;grid-template-rows:100vh;height:100vh;overflow:hidden}
.app.rail-collapsed{--rail-w:64px}

/* left rail */
.rail{background:var(--rail);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;
  height:100vh;overflow:hidden;color:var(--rail-ink)}
.rail-brand{display:flex;align-items:center;gap:10px;height:var(--top-h);padding:0 16px;flex:0 0 auto;
  border-bottom:1px solid var(--rail-line)}
.rail-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,var(--brand-400),var(--brand));
  display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.rail-logo svg{width:17px;height:17px}
.rail-name{font-weight:700;font-size:14px;letter-spacing:-.01em;color:#fff;white-space:nowrap}
.rail-name span{color:var(--brand-400);font-weight:600}
.app.rail-collapsed .rail-name,.app.rail-collapsed .rail-tenant,.app.rail-collapsed .nav-label,
.app.rail-collapsed .nav-group-t,.app.rail-collapsed .nav-badge,.app.rail-collapsed .rail-foot-txt{display:none}
.app.rail-collapsed .nav-item{justify-content:center;padding:9px 0}
.rail-tenant{margin:12px 12px 6px;padding:9px 10px;border:1px solid var(--rail-line);border-radius:var(--r-md);
  background:var(--rail-2);cursor:pointer;display:flex;align-items:center;gap:9px}
.rail-tenant:hover{border-color:var(--brand-500)}
.tenant-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-400);flex:0 0 auto;box-shadow:0 0 0 3px rgba(18,144,154,.2)}
.tenant-meta{min-width:0}
.tenant-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenant-sub{font-size:10.5px;color:var(--rail-muted);white-space:nowrap}
.nav{flex:1 1 auto;overflow-y:auto;padding:6px 8px 14px}
.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--rail-line);border-radius:8px}
.nav-group-t{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);
  padding:14px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-sm);color:var(--rail-ink);
  font-size:12.5px;font-weight:500;cursor:pointer;position:relative;border:1px solid transparent;white-space:nowrap}
.nav-item:hover{background:var(--rail-2);color:#fff}
.nav-item svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;opacity:.9}
.nav-item.active{background:linear-gradient(90deg,rgba(18,144,154,.22),rgba(18,144,154,.06));color:#fff;
  border-color:var(--rail-line)}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--brand-400)}
.nav-label{flex:1 1 auto}
.nav-badge{font-size:10px;font-weight:700;min-width:17px;height:17px;padding:0 5px;border-radius:9px;display:grid;
  place-items:center;background:var(--crit);color:#fff}
.nav-badge.amber{background:var(--warn)} .nav-badge.neutral{background:var(--rail-line);color:var(--rail-ink)}
.rail-foot{flex:0 0 auto;border-top:1px solid var(--rail-line);padding:9px}
.rail-user{display:flex;align-items:center;gap:9px;padding:6px;border-radius:var(--r-sm);cursor:pointer}
.rail-user:hover{background:var(--rail-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-600);color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:700;flex:0 0 auto}
.rail-foot-txt{min-width:0}.rail-foot-txt b{display:block;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot-txt span{font-size:10.5px;color:var(--rail-muted)}

/* main column */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.topbar{height:var(--top-h);flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--muted);
  display:grid;place-items:center}
.icon-btn:hover{background:var(--panel-3);color:var(--ink);border-color:var(--line)}
.icon-btn svg{width:17px;height:17px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.crumb span{color:var(--faint);font-size:12px}
.search{flex:1 1 auto;max-width:440px;position:relative}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);
  padding:0 12px 0 34px;font-size:12.5px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand-400);background:var(--panel);box-shadow:0 0 0 3px var(--brand-tint)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
.search kbd{position:absolute;right:8px;top:8px;font-size:10px;font-family:var(--mono);color:var(--faint);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--panel)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.compliance{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--good-line);
  background:var(--good-bg);color:var(--good);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.compliance .beat{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(31,138,87,.5);
  animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(31,138,87,.45)}70%{box-shadow:0 0 0 6px rgba(31,138,87,0)}100%{box-shadow:0 0 0 0 rgba(31,138,87,0)}}
.cycle-pick{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--panel-2);font-size:12px;font-weight:550;color:var(--ink-2)}
.cycle-pick:hover{border-color:var(--line-strong)}.cycle-pick svg{width:14px;height:14px;color:var(--faint)}
.bell{position:relative}.bell::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--crit);border:2px solid var(--panel)}

/* content scroll area */
.content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:11px}.content::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid var(--bg)}
.page{padding:20px 24px 60px;max-width:1560px;margin:0 auto}

/* page header */
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.phead-t h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.phead-t p{margin:4px 0 0;color:var(--muted);font-size:12.5px;max-width:70ch}
.phead-act{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:var(--r-md);font-size:12px;
  font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--panel-3)}
.btn.sm{height:27px;padding:0 10px;font-size:11.5px}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}.btn.danger:hover{background:var(--crit-bg)}

/* filter bar */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--panel)}
.fl-field{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel-2);font-size:12px;color:var(--ink-2);font-weight:550}
.fl-field:hover{border-color:var(--line-strong)}.fl-field svg{width:13px;height:13px;color:var(--faint)}
.fl-field b{color:var(--ink);font-weight:650}
.fl-sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:var(--r-pill);
  background:var(--brand-tint);border:1px solid var(--brand-tint-2);color:var(--brand);font-size:11.5px;font-weight:600}
.chip button{border:none;background:transparent;color:var(--brand);display:grid;place-items:center;padding:2px;border-radius:50%}
.chip button:hover{background:var(--brand-tint-2)}.chip svg{width:12px;height:12px}

/* ---------------- GRID + PANELS ---------------- */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)} .g-6{grid-template-columns:repeat(6,1fr)}
.span-2{grid-column:span 2}.span-3{grid-column:span 3}.span-4{grid-column:span 4}
@media(max-width:1200px){.g-4{grid-template-columns:repeat(2,1fr)}.g-6{grid-template-columns:repeat(3,1fr)}
  .g-3{grid-template-columns:repeat(2,1fr)}.span-2,.span-3,.span-4{grid-column:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.panel-h h3{margin:0;font-size:13px;font-weight:650;letter-spacing:-.01em}
.panel-h .sub{color:var(--faint);font-size:11px;font-weight:500}
.panel-h .act{margin-left:auto;display:flex;align-items:center;gap:6px}
.panel-b{padding:14px}
.link{color:var(--brand-500);font-weight:600;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--brand)}.link svg{width:13px;height:13px}

/* KPI tiles */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;gap:9px;min-width:0}
.kpi-top{display:flex;align-items:center;gap:8px}
.kpi-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand);flex:0 0 auto}
.kpi-ic svg{width:16px;height:16px}
.kpi-l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi-v{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1}
.kpi-v small{font-size:14px;font-weight:600;color:var(--faint)}
.kpi-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:var(--r-pill)}
.delta svg{width:12px;height:12px}
.delta.up{color:var(--good);background:var(--good-bg)}.delta.down{color:var(--crit);background:var(--crit-bg)}
.delta.flat{color:var(--muted);background:var(--panel-3)}
.kpi-sub{font-size:11px;color:var(--faint)}
.kpi-target{height:5px;border-radius:5px;background:var(--panel-3);overflow:hidden;position:relative}
.kpi-target i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--brand-400)}
.kpi-target .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);border-radius:2px}

/* ---------------- STATUS PILLS ---------------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:var(--r-pill);font-size:10.5px;
  font-weight:700;letter-spacing:.01em;border:1px solid transparent;white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.pill.crit{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.pill.info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.pill.viol{color:var(--viol);background:var(--viol-bg);border-color:var(--viol-line)}
.pill.pv{color:var(--pv);background:var(--pv-bg);border-color:var(--pv-line)}
.pill.neutral{color:var(--muted);background:var(--panel-3);border-color:var(--line)}
.pill.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
.tier{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:10.5px;font-weight:800;font-family:var(--mono)}
.tier.A{background:#EAF3EE;color:#1F8A57;border:1px solid var(--good-line)}
.tier.B{background:#FBF0DC;color:#B4740B;border:1px solid var(--warn-line)}
.tier.C{background:var(--panel-3);color:var(--muted);border:1px solid var(--line)}
:root[data-theme="dark"] .tier.A{background:var(--good-bg)} :root[data-theme="dark"] .tier.B{background:var(--warn-bg)}

/* ---------------- TABLES ---------------- */
.tbl-wrap{overflow-x:auto;border-radius:0 0 var(--r-lg) var(--r-lg)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--panel-2);text-align:left;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th.r{text-align:right}.tbl td.r{text-align:right}
.tbl th.sort{cursor:pointer}.tbl th.sort:hover{color:var(--ink)}
.tbl th.sort svg{width:12px;height:12px;vertical-align:-2px;opacity:.5;margin-left:2px}
.tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr.sel{background:var(--brand-tint)}
.tbl .strong{color:var(--ink);font-weight:600}
.tbl .rowlink{cursor:pointer}
.ck{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;display:inline-grid;place-items:center;
  background:var(--panel);vertical-align:-3px;color:transparent}
.ck.on{background:var(--brand);border-color:var(--brand);color:#fff}.ck svg{width:11px;height:11px}
.cellface{display:flex;align-items:center;gap:9px;min-width:0}
.mini-av{width:24px;height:24px;border-radius:50%;background:var(--panel-3);color:var(--ink-2);display:grid;place-items:center;
  font-size:9.5px;font-weight:700;flex:0 0 auto;border:1px solid var(--line)}
.subtle{color:var(--faint);font-size:11px}
.bulkbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--ink);color:#fff;border-radius:var(--r-md);
  margin:0 14px 12px;font-size:12px}
.bulkbar .cnt{font-weight:700}.bulkbar .sp{margin-left:auto}
.bulkbar .bb{display:inline-flex;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
  height:27px;padding:0 10px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600}
.bulkbar .bb:hover{background:rgba(255,255,255,.22)}.bulkbar .bb svg{width:13px;height:13px}
.tbl-foot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line-2);color:var(--muted);font-size:11.5px}
.pager{margin-left:auto;display:flex;align-items:center;gap:4px}
.pager button{min-width:27px;height:27px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);font-size:11.5px;
  color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.pager button:hover{border-color:var(--line-strong)}.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* bars in cells */
.cellbar{display:flex;align-items:center;gap:8px}
.cellbar .track{flex:1 1 auto;height:6px;background:var(--panel-3);border-radius:5px;overflow:hidden;min-width:54px}
.cellbar .fill{height:100%;border-radius:5px;background:var(--brand-400)}
.cellbar .fill.good{background:var(--good)}.cellbar .fill.warn{background:var(--warn)}.cellbar .fill.crit{background:var(--crit)}
.cellbar b{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink);min-width:34px;text-align:right}

/* ---------------- CHART PRIMITIVES ---------------- */
.chart{width:100%}
.axis-l{font-size:10px;fill:var(--faint);font-family:var(--sans)}
.grid-l{stroke:var(--grid);stroke-width:1}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:550}
.legend .lk{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .sw.ln{height:3px;width:14px;border-radius:2px}
.donut-center{font-weight:750;letter-spacing:-.02em}
.spark{display:block}
.tt{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;font-size:11px;padding:7px 9px;border-radius:6px;
  box-shadow:var(--sh-2);opacity:0;transition:opacity .1s;max-width:230px}
.tt .tk{display:flex;align-items:center;gap:6px;margin-top:3px}.tt .tk .sw{width:8px;height:8px;border-radius:2px}
.tt b{font-weight:700}.tt .tv{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:14px}

/* progress ring */
.ring-wrap{display:flex;align-items:center;gap:12px}
.readi{display:inline-grid;place-items:center;position:relative}
.readi b{position:absolute;font-size:12px;font-weight:750}

/* ---------------- STATES (empty / loading / error) ---------------- */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px;gap:12px}
.state-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--panel-3);color:var(--muted)}
.state-ic svg{width:24px;height:24px}
.state h4{margin:0;font-size:15px;font-weight:650}.state p{margin:0;color:var(--muted);font-size:12.5px;max-width:44ch}
.state.err .state-ic{background:var(--crit-bg);color:var(--crit)}
.skel{background:linear-gradient(90deg,var(--panel-3) 25%,var(--line-2) 37%,var(--panel-3) 63%);background-size:400% 100%;
  animation:sh 1.3s ease infinite;border-radius:5px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand-400);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* banners */
.banner{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-radius:var(--r-md);border:1px solid;font-size:12.5px}
.banner svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.banner b{font-weight:700}
.banner.pv{background:var(--pv-bg);border-color:var(--pv-line);color:var(--pv)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.banner.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.banner .x{margin-left:auto}
.banner .tx{color:var(--ink-2)}.banner.pv .tx{color:var(--pv)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.44);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);border-left:1px solid var(--line);
  z-index:70;transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-3)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.drawer-h h3{margin:0;font-size:15px;font-weight:700}
.drawer-b{flex:1 1 auto;overflow-y:auto;padding:18px}
.drawer-f{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2)}

/* profile / role switcher */
.pchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 7px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.pchip:hover{border-color:var(--line-strong);background:var(--panel)}
.pchip .avatar{width:24px;height:24px;font-size:10px}
.pchip .pmeta{text-align:left;line-height:1.15;min-width:0}
.pchip .pmeta b{display:block;font-size:11.5px;font-weight:650;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.pchip .pmeta span{font-size:10px;color:var(--muted);white-space:nowrap}
.pchip .chev{width:14px;height:14px;color:var(--faint);flex:0 0 auto}
.rail-user .chev{width:14px;height:14px;color:var(--rail-muted);margin-left:auto;flex:0 0 auto}
.pmenu-scrim{position:fixed;inset:0;z-index:95;display:none}.pmenu-scrim.on{display:block}
.pmenu{position:fixed;z-index:96;width:302px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--sh-3);padding:6px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.14s}
.pmenu.on{opacity:1;transform:none;pointer-events:auto}
.pmenu-h{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:9px 10px 7px;
  display:flex;align-items:center;gap:6px}.pmenu-h svg{width:13px;height:13px}
.pmenu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}
.pmenu-item:hover{background:var(--panel-3)}
.pmenu-item.on{background:var(--brand-tint);border-color:var(--brand-tint-2)}
.pmenu-item .m{min-width:0;flex:1}
.pmenu-item .m b{display:block;font-size:12.5px;color:var(--ink)}
.pmenu-item .m span{font-size:11px;color:var(--muted)}
.pmenu-item .m .rmods{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.pmenu-item .m .rmods i{font-style:normal;font-size:9.5px;font-weight:600;color:var(--muted);background:var(--panel-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.pmenu-item.on .m .rmods i{background:var(--panel);border-color:var(--brand-tint-2)}
.pmenu-item .ck2{margin-left:2px;color:var(--brand);flex:0 0 auto;width:17px;height:17px}
.pmenu-foot{font-size:10.5px;color:var(--faint);padding:9px 10px 6px;border-top:1px solid var(--line-2);margin-top:4px;line-height:1.4}

/* misc utility */
.def{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:12.5px}
.def dt{color:var(--muted);font-weight:550}.def dd{margin:0;color:var(--ink);font-weight:550}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--panel-3);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 7px}
.mut{color:var(--muted)} .fnt{color:var(--faint)} .ink{color:var(--ink)}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;
  display:flex;align-items:center;gap:9px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.stk{display:flex;flex-direction:column;gap:2px}
.flow-note{font-size:11px;color:var(--faint);font-style:italic}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--brand-400);z-index:1}
.tl-dot.good{border-color:var(--good)}.tl-dot.pv{border-color:var(--pv)}.tl-dot.warn{border-color:var(--warn)}
.tl-t{font-size:12px;font-weight:650}.tl-m{font-size:11px;color:var(--faint)}
.tl-x{margin-top:4px;font-size:11.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px}

/* config layout */
.cfg{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cfg{grid-template-columns:1fr}}
.cfg-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.cfg-nav a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-sm);font-size:12px;font-weight:550;color:var(--ink-2)}
.cfg-nav a:hover{background:var(--panel-3)}.cfg-nav a.on{background:var(--brand-tint);color:var(--brand);font-weight:650}
.cfg-nav a svg{width:15px;height:15px}
.cfg-nav .grp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 11px 4px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:11.5px;font-weight:650;color:var(--ink-2)}
.field .hint{font-size:11px;color:var(--faint)}
.field input[type=text],.field input[type=number],.field select,.field textarea{height:34px;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:0 11px;font-size:12.5px;background:var(--panel-2);color:var(--ink);font-family:inherit}
.field textarea{height:auto;padding:9px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand-400);box-shadow:0 0 0 3px var(--brand-tint)}
.toggle{width:38px;height:22px;border-radius:12px;background:var(--line-strong);position:relative;transition:.15s;flex:0 0 auto}
.toggle.on{background:var(--brand)}.toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:var(--sh-1)}
.toggle.on i{left:18px}
.swatchrow{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2px var(--brand)}
.rowedit{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);margin-bottom:8px}

/* design-system swatches */
.ds-sw{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ds-sw .cap{height:52px}.ds-sw .meta{padding:8px 10px;font-size:11px}
.ds-sw .meta b{display:block;font-size:11.5px}.ds-sw .meta code{font-family:var(--mono);color:var(--faint);font-size:10.5px}
.type-row{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.type-row .lbl{width:120px;flex:0 0 auto;font-size:11px;color:var(--faint)}

/* responsive rail -> overlay on small screens */
@media(max-width:840px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .app.rail-open .rail{transform:none}
  .rail-toggle-wide{display:none}
}
.rail-scrim{display:none}
@media(max-width:840px){.app.rail-open .rail-scrim{display:block;position:fixed;inset:0;background:rgba(10,16,22,.4);z-index:80}}
.only-wide{}@media(max-width:840px){.only-wide{display:none}}
</style>

<div class="app" id="app">

        <div class="tenant-sub">UAE tenant · en · ar</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="color:var(--rail-muted)"><path d="M8 9l4-4 4 4M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M8 9l4-4 4 4M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

  <!-- MAIN -->

        <input placeholder="Search reps, HCPs, audit events, reports…" onfocus="toast('Global search spans reps, HCPs, audit trail & reports')">
        <kbd>⌘K</kbd>
      </div>
      <div class="top-right">
        <button class="cycle-pick only-wide" onclick="toast('Reporting period — Cycle 4 · 15 Jul–11 Aug 2026')">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Cycle 4 · Wk 3
        </button>
        <button class="compliance" onclick="complianceChip()" title="Compliance status">
          <span class="beat"></span> All systems compliant
        </button>
        <button class="icon-btn bell" onclick="toast('3 items need review — 1 PV, 2 escalations')" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20a2 2 0 004 0" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>

          <svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
        <div style="width:1px;height:22px;background:var(--line);margin:0 2px"></div>
        <button class="pchip" id="topProfile" onclick="toggleProfile(event)" title="Switch user / role" aria-label="Account and role">
          <span class="avatar" id="topAv">NH</span>
          <div class="pmeta only-wide"><b id="topName">Nadia Haddad</b><span id="topRole">Manager</span></div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <main class="content" id="content"><!-- screen renders here --></main>

</div>

<!-- DRAWER -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer-h">
    <h3 id="drawerTitle">Detail</h3>
    <button class="icon-btn" onclick="closeDrawer()" style="margin-left:auto" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f" id="drawerFoot"></div>
</aside>
<div class="pmenu-scrim" id="pmenuScrim" onclick="closeProfile()"></div>
<div class="pmenu" id="pmenu" role="menu" aria-label="Switch user"></div>
<div class="tt" id="tt"></div>
<div id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);z-index:100;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:550;box-shadow:var(--sh-3);opacity:0;transition:.22s;pointer-events:none;max-width:80vw"></div>

 mkt:'<path d="M3 11l16-7v16L3 13v-2z"/><path d="M7 12v5a2 2 0 004 0"/>',
 pv:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M12 8v5M12 16h.01"/>',
 shield:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/>',
 cog:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',

<script id="app-core">
/* ============================================================
   CORE — helpers, chart primitives, components, router
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- toast / tooltip ---- */
let _tT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(_tT);_tT=setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(-50%) translateY(30px)';},2600);}
window.toast=toast;
function showTT(e,html){const tt=$('#tt');tt.innerHTML=html;tt.style.opacity=1;
  let x=e.clientX+14,y=e.clientY+14;if(x+240>innerWidth)x=e.clientX-240;tt.style.left=x+'px';tt.style.top=y+'px';}
function hideTT(){$('#tt').style.opacity=0;}

/* ---- theme + rail ---- */
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme')||'light';
  r.setAttribute('data-theme',cur==='light'?'dark':'light');}
function toggleRail(force){const a=$('#app');const small=innerWidth<=840;
  if(small){a.classList.toggle('rail-open',force===undefined?!a.classList.contains('rail-open'):force);}
  else{a.classList.toggle('rail-collapsed',force===undefined?!a.classList.contains('rail-collapsed'):!force);}}
window.toggleTheme=toggleTheme;window.toggleRail=toggleRail;

/* ---- drawer ---- */
function openDrawer(title,body,foot){$('#drawerTitle').innerHTML=title;$('#drawerBody').innerHTML=body;
  $('#drawerFoot').innerHTML=foot||'';$('#drawer').classList.add('on');$('#scrim').classList.add('on');}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');}
window.openDrawer=openDrawer;window.closeDrawer=closeDrawer;

/* ---- small format ---- */
const pct=n=>n+'%';
function tone(v,hi=90,mid=75){return v>=hi?'good':v>=mid?'warn':'crit';}
function pill(txt,t,dot){return `<span class="pill ${t}">${dot?'<span class="dt"></span>':''}${esc(txt)}</span>`;}
function statusPill(s){const m={'Compliant':'good','Off-Label Refused':'warn','PV Signal':'pv','Competitive Mention':'viol',
  'Serious':'crit','Non-serious':'warn','Awaiting review':'warn','In review':'info','Approved · Sent':'good',
  'Positive':'good','Neutral':'neutral','Cautious':'warn','Negative':'crit',
  'Strong':'good','Developing':'info','Needs work':'crit','Active':'good','Draft':'neutral'};
  const ic2={'PV Signal':'pv','Off-Label Refused':'shield','Competitive Mention':'flag'};
  const i=ic2[s]?ic(ic2[s]):'';return `<span class="pill ${m[s]||'neutral'}">${i}${esc(s)}</span>`;}
window.statusPill=statusPill;window.pill=pill;

/* ---- KPI tile ---- */
function kpi(o){
  const d=o.delta;let dh='';
  if(d!==undefined&&d!==null){const dir=d>0?'up':d<0?'down':'flat';const ar=d>0?'arrowup':d<0?'arrowdown':'route2';
    dh=`<span class="delta ${dir}">${ic(ar)}${d>0?'+':''}${d}${o.dunit||'%'}</span>`;}
  const spark=o.spark?sparkline(o.spark,o.sparkTone||'brand'):'';
  const tgt=o.target!==undefined?`<div class="kpi-target" title="Target ${o.target}${o.dunit||'%'}"><i style="width:${Math.min(100,o.val/(o.max||100)*100)}%"></i><span class="mark" style="left:${o.target/(o.max||100)*100}%"></span></div>`:'';
  return `<div class="kpi">
    <div class="kpi-top"><span class="kpi-ic" ${o.iconBg?`style="background:${o.iconBg.bg};color:${o.iconBg.fg}"`:''}>${ic(o.icon||'chart')}</span><span class="kpi-l">${esc(o.label)}</span></div>
    <div class="kpi-v num">${o.val}${o.unit?`<small>${o.unit}</small>`:''}</div>
    <div class="kpi-foot">${dh}${o.sub?`<span class="kpi-sub">${esc(o.sub)}</span>`:''}${spark}</div>${tgt}</div>`;
}

/* ---- sparkline ---- */
function sparkline(pts,t){const w=68,h=22,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const X=i=>i/(pts.length-1)*w, Y=v=>h-2-((v-mn)/rg)*(h-4);
  const d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const col=t==='crit'?'var(--crit)':t==='warn'?'var(--warn)':t==='good'?'var(--good)':'var(--brand-400)';
  const ar=`spark${Math.random().toString(36).slice(2,7)}`;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="margin-left:auto"><defs><linearGradient id="${ar}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${ar})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1])}" r="2.2" fill="${col}"/></svg>`;
}

/* ---- line/area chart (multi-series, single y-axis) ---- */
const CAT=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function lineChart(o){
  const W=o.w||640,H=o.h||220,pl=34,pr=12,pt=12,pb=26;
  const iw=W-pl-pr, ih=H-pt-pb;
  const all=o.series.flatMap(s=>s.data);const mx=o.max||Math.ceil(Math.max(...all)/10)*10;const mn=o.min||0;
  const X=i=>pl+(i/(o.labels.length-1))*iw, Y=v=>pt+ih-((v-mn)/(mx-mn))*ih;
  let grid='',axis='';for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4;const y=Y(v);
    grid+=`<line class="grid-l" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/>`;
    axis+=`<text class="axis-l" x="${pl-6}" y="${y+3}" text-anchor="end">${Math.round(v)}${o.yunit||''}</text>`;}
  let xl='';o.labels.forEach((l,i)=>{if(o.labels.length>10&&i%2)return;xl+=`<text class="axis-l" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`;});
  let paths='';o.series.forEach((s,si)=>{const c=s.color||CAT[si];
    const d=s.data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    if(s.area){const ar='la'+si+Math.random().toString(36).slice(2,6);
      paths+=`<defs><linearGradient id="${ar}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".18"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${X(s.data.length-1)} ${pt+ih} L${pl} ${pt+ih} Z" fill="url(#${ar})"/>`;}
    paths+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.data.forEach((v,i)=>{paths+=`<circle cx="${X(i)}" cy="${Y(v)}" r="8" fill="transparent" style="cursor:pointer"
      onmousemove="showTT(event,'<b>${esc(o.labels[i])}</b><div class=tk><span class=sw style=background:${c}></span>${esc(s.name)}<span class=tv>${v}${o.yunit||''}</span></div>')" onmouseleave="hideTT()"/>`;});
  });
  const leg=o.series.length>1?`<div class="legend" style="margin-top:10px">${o.series.map((s,i)=>`<span class="lk"><span class="sw ln" style="background:${s.color||CAT[i]}"></span>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${axis}${xl}${paths}</svg>${leg}`;
}

/* ---- grouped/stacked bar chart ---- */
function barChart(o){
  const W=o.w||640,H=o.h||220,pl=34,pr=12,pt=12,pb=26;const iw=W-pl-pr,ih=H-pt-pb;
  const stacks=o.data.map(d=>o.series.reduce((a,s)=>a+d[s.key],0));
  const mx=o.max||Math.ceil(Math.max(...(o.stacked?stacks:o.data.flatMap(d=>o.series.map(s=>d[s.key]))))/10)*10;
  const Y=v=>pt+ih-(v/mx)*ih;const bw=iw/o.data.length;
  let grid='',axis='';for(let g=0;g<=4;g++){const v=mx*g/4;const y=Y(v);
    grid+=`<line class="grid-l" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/>`;
    axis+=`<text class="axis-l" x="${pl-6}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`;}
  let bars='';o.data.forEach((d,i)=>{const cx=pl+bw*i+bw/2;
    if(o.stacked){let acc=0;o.series.forEach((s,si)=>{const h=(d[s.key]/mx)*ih;const y=Y(acc)-h;acc+=d[s.key];
      const w=Math.min(30,bw*.62);
      bars+=`<rect x="${cx-w/2}" y="${y}" width="${w}" height="${Math.max(0,h-2)}" rx="2" fill="${s.color||CAT[si]}"
        onmousemove="showTT(event,'<b>${esc(d.label)}</b><div class=tk><span class=sw style=background:${s.color||CAT[si]}></span>${esc(s.name)}<span class=tv>${d[s.key]}</span></div>')" onmouseleave="hideTT()"/>`;});
    }else{const gw=bw*.64/o.series.length;o.series.forEach((s,si)=>{const h=(d[s.key]/mx)*ih;
      const x=cx-(bw*.32)+gw*si;
      bars+=`<rect x="${x}" y="${Y(d[s.key])}" width="${gw-2}" height="${Math.max(0,h)}" rx="2" fill="${s.color||CAT[si]}"
        onmousemove="showTT(event,'<b>${esc(d.label)}</b><div class=tk><span class=sw style=background:${s.color||CAT[si]}></span>${esc(s.name)}<span class=tv>${d[s.key]}</span></div>')" onmouseleave="hideTT()"/>`;});}
    bars+=`<text class="axis-l" x="${cx}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`;});
  const leg=`<div class="legend" style="margin-top:10px">${o.series.map((s,i)=>`<span class="lk"><span class="sw" style="background:${s.color||CAT[i]}"></span>${esc(s.name)}</span>`).join('')}</div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${axis}${bars}</svg>${leg}`;
}

/* ---- horizontal bars ---- */
function hbars(rows,o){o=o||{};const mx=o.max||Math.max(...rows.map(r=>r.v));
  return `<div class="stk" style="gap:9px">`+rows.map(r=>{const w=(r.v/mx)*100;const c=r.color||'var(--brand-400)';
    return `<div style="display:flex;align-items:center;gap:10px"><div style="width:${o.lw||120}px;flex:0 0 auto;font-size:11.5px;color:var(--ink-2);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.l)}</div>
      <div style="flex:1;height:16px;background:var(--panel-3);border-radius:5px;overflow:hidden"><div style="height:100%;width:${w}%;background:${c};border-radius:5px"></div></div>
      <b class="num" style="width:44px;text-align:right;font-size:11.5px">${r.d||r.v}</b></div>`;}).join('')+`</div>`;
}

/* ---- donut ---- */
function donut(segs,o){o=o||{};const r=o.r||54,sw=o.sw||16,cx=r+sw,cy=r+sw,C=2*Math.PI*r;
  const tot=segs.reduce((a,s)=>a+s.v,0);let off=0;let arcs='';
  segs.forEach((s,i)=>{const frac=s.v/tot;const len=frac*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color||CAT[i]}" stroke-width="${sw}"
      stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"
      onmousemove="showTT(event,'<b>${esc(s.l)}</b><div class=tk><span class=sw style=background:${s.color||CAT[i]}></span>${Math.round(frac*100)}%<span class=tv>${s.v}</span></div>')" onmouseleave="hideTT()"/>`;
    off+=len;});
  const size=(r+sw)*2;
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div style="position:relative;flex:0 0 auto">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div class="donut-center num" style="font-size:22px">${o.center||tot}</div><div style="font-size:10.5px;color:var(--faint)">${o.centerLabel||'total'}</div></div></div></div>
    <div class="stk" style="gap:7px;flex:1;min-width:120px">${segs.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="sw" style="width:9px;height:9px;border-radius:3px;background:${s.color||CAT[i]}"></span><span style="color:var(--ink-2)">${esc(s.l)}</span><b class="num" style="margin-left:auto;font-variant-numeric:tabular-nums">${s.v}</b></div>`).join('')}</div></div>`;
}

/* ---- readiness ring ---- */
function ring(v,o){o=o||{};const size=o.size||64,sw=o.sw||7,r=(size-sw)/2,c=2*Math.PI*r,C=size/2;
  const col=v>=85?'var(--good)':v>=70?'var(--brand-400)':v>=55?'var(--warn)':'var(--crit)';
  return `<div class="readi" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="${sw}"/><circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${C} ${C})"/></svg><b style="color:${col};font-size:${o.fs||13}px">${v}</b></div>`;
}

/* ---- data table ---- */
let SEL={};
function dtable(id,cols,rows,o){o=o||{};SEL[id]=SEL[id]||new Set();
  const head=`<tr>${o.select?`<th style="width:36px"><span class="ck ${SEL[id].size===rows.length&&rows.length?'on':''}" onclick="selAll('${id}',${rows.length})">${ic('check')}</span></th>`:''}${cols.map(c=>`<th class="${c.r?'r':''} ${c.sort?'sort':''}" ${c.sort?`onclick="toast('Sorted by ${esc(c.h)}')"`:''}>${esc(c.h)}${c.sort?ic('down'):''}</th>`).join('')}</tr>`;
  const body=rows.map((row,ri)=>{const on=SEL[id].has(ri);
    return `<tr class="${on?'sel':''} ${o.rowClick?'rowlink':''}" ${o.rowClick?`onclick="${o.rowClick}(${ri})"`:''}>${o.select?`<td onclick="event.stopPropagation();selRow('${id}',${ri},${rows.length})"><span class="ck ${on?'on':''}">${ic('check')}</span></td>`:''}${cols.map(c=>`<td class="${c.r?'r':''} ${c.cls||''}">${c.render?c.render(row,ri):esc(row[c.k]??'')}</td>`).join('')}</tr>`;}).join('');
  const bulk=o.select&&o.bulk?`<div class="bulkbar" id="bulk-${id}" style="display:none"><span class="cnt" id="bulkn-${id}">0</span> selected ${o.bulk.map(b=>`<button class="bb" onclick="toast('${esc(b.t)} — applied to selection')">${ic(b.i)}${esc(b.t)}</button>`).join('')}<span class="sp"></span><button class="bb" onclick="clearSel('${id}')">${ic('x')}Clear</button></div>`:'';
  const foot=o.foot!==false?`<div class="tbl-foot"><span>Showing <b class="num">${rows.length}</b>${o.total?` of <b class="num">${o.total}</b>`:''} ${o.unit||'rows'}</span>${o.footAct||''}<div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button></div></div>`:'';
  return `${bulk}<div class="tbl-wrap"><table class="tbl" id="tbl-${id}"><thead>${head}</thead><tbody>${body}</tbody></table></div>${foot}`;
}
function selRow(id,ri,n){SEL[id].has(ri)?SEL[id].delete(ri):SEL[id].add(ri);refreshSel(id,n);}
function selAll(id,n){if(SEL[id].size===n)SEL[id].clear();else for(let i=0;i<n;i++)SEL[id].add(i);refreshSel(id,n);}
function clearSel(id){SEL[id].clear();refreshSel(id);}
function refreshSel(id,n){const t=$('#tbl-'+id);if(!t)return;const rows=t.querySelectorAll('tbody tr');
  rows.forEach((tr,i)=>{const on=SEL[id].has(i);tr.classList.toggle('sel',on);const ck=tr.querySelector('td .ck');if(ck)ck.classList.toggle('on',on);});
  const hck=t.querySelector('thead .ck');if(hck)hck.classList.toggle('on',SEL[id].size===n&&n);
  const b=$('#bulk-'+id);if(b){b.style.display=SEL[id].size?'flex':'none';$('#bulkn-'+id).textContent=SEL[id].size;}}
window.selRow=selRow;window.selAll=selAll;window.clearSel=clearSel;

/* ---- panel + section helpers ---- */
function panel(o){return `<div class="panel ${o.cls||''}" ${o.span?`style="grid-column:span ${o.span}"`:''}>
  ${o.title?`<div class="panel-h"><h3>${o.title}</h3>${o.sub?`<span class="sub">${o.sub}</span>`:''}${o.act?`<div class="act">${o.act}</div>`:''}</div>`:''}
  <div class="panel-b" ${o.pad===false?'style="padding:0"':''}>${o.body}</div></div>`;}
function phead(o){return `<div class="phead"><div class="phead-t"><h1>${o.title}</h1>${o.sub?`<p>${o.sub}</p>`:''}</div>${o.act?`<div class="phead-act">${o.act}</div>`:''}</div>`;}
function filterBar(items){return `<div class="filters">${ic('filter')&&`<span style="display:inline-flex;color:var(--faint)">${ic('filter')}</span>`}${items.join('')}</div>`;}
function fl(label,val,icn){return `<button class="fl-field" onclick="toast('Filter: ${esc(label)}')">${icn?ic(icn):''}${esc(label)} ${val?`<b>${esc(val)}</b>`:''}${ic('down')}</button>`;}
function chip(txt){return `<span class="chip">${esc(txt)}<button onclick="this.closest('.chip').remove()">${ic('x')}</button></span>`;}
function state(o){return `<div class="state ${o.err?'err':''}"><div class="state-ic">${ic(o.icon||'empty')}</div><h4>${o.title}</h4><p>${o.msg}</p>${o.act?`<div style="margin-top:4px">${o.act}</div>`:''}</div>`;}
function exportBtn(){return `<button class="btn" onclick="toast('Export queued — CSV will download')">${ic('export')}Export</button>`;}

let CFG_ACTIVE='catalogue';
SCREENS.config=function(){
  const nav=CFG_SURFACES.map(g=>`<div class="grp">${g.grp}</div>`+g.items.map(it=>`<a class="${it[0]===CFG_ACTIVE?'on':''}" onclick="CFG_ACTIVE='${it[0]}';go('config')">${ic(it[1])}${it[2]}</a>`).join('')).join('');
  return phead({title:'Configuration',
    sub:'A new pharmaceutical client is brought live by configuring — not rebuilding. 13 per-client surfaces span the product catalogue, targeting, engagement rules, governance and branding.',
    act:`<span class="pill neutral"><span class="dt"></span>Gulf Pharma · UAE</span><button class="btn" onclick="toast('Changes staged — not yet published')">${ic('doc')}Staged changes (3)</button><button class="btn primary" onclick="toast('Configuration published to tenant')">${ic('check')}Publish</button>`})
  + `<div class="cfg"><nav class="cfg-nav">${nav}</nav><div style="min-width:0">${cfgPanel(CFG_ACTIVE)}</div></div>`;
};
function cfgPanel(id){
  if(id==='catalogue'){
    const cols=[
     {h:'Product',k:'n',cls:'strong',render:r=>`<div class="cellface"><span class="mini-av" style="border-radius:7px;background:var(--brand-tint);color:var(--brand);border-color:var(--brand-tint-2)">${ic('pill')}</span><div class="stk"><span class="strong">${esc(r.n)}</span><span class="subtle mono">${esc(r.sku)}</span></div></div>`},
     {h:'Therapeutic area',k:'ta',render:r=>`<span class="tag">${ic('branch')}${esc(r.ta)}</span>`},
     {h:'Indication',k:'ind',render:r=>`<span class="mut">${esc(r.ind)}</span>`},
     {h:'Approved materials',k:'mat',r:1,render:r=>`<span class="num strong">${r.mat}</span>`},
     {h:'Status',k:'status',render:r=>statusPill(r.status)},
     {h:'',k:'',render:r=>`<div style="display:flex;gap:4px;justify-content:flex-end"><button class="btn sm ghost" onclick="event.stopPropagation();toast('Edit ${esc(r.n)}')">${ic('edit')}</button><button class="btn sm ghost" onclick="event.stopPropagation();toast('Manage materials')">${ic('book')}</button></div>`}
    ];
    return panel({title:'Product catalogue',sub:`${PRODUCTS.length} products · ${PRODUCTS.filter(p=>p.status==='Active').length} active`,
      act:`<button class="btn sm" onclick="toast('Import from CSV')">${ic('download')}Import</button><button class="btn sm primary" onclick="toast('Add product')">${ic('plus')}Add product</button>`,pad:false,
      body:dtable('cat',cols,PRODUCTS,{select:true,bulk:[{i:'tag',t:'Assign TA'},{i:'check',t:'Activate'},{i:'export',t:'Export'}],unit:'products'})});
  }
  if(id==='tiers'){
    return panel({title:'Doctor tiers & frequency',sub:'target visit frequency per tier',body:`
      <p class="mut" style="margin:0 0 14px;font-size:12px">Tier definitions and target visit frequencies drive weekly planning and coverage KPIs. Applied per cycle.</p>
      ${[['A','Key influencers · high potential','8','2×/month','var(--good)','A'],['B','Established prescribers','4','1×/month','var(--warn)','B'],['C','Occasional · maintain presence','2','1×/quarter','var(--muted)','C']].map(t=>`
        <div class="rowedit"><span class="tier ${t[5]}">${t[5]}</span><div class="stk" style="flex:1"><b style="font-size:12.5px">Tier ${t[0]}</b><span class="subtle">${t[1]}</span></div>
          <div class="field" style="margin:0;width:120px"><label>Target /cycle</label><input type="number" value="${t[2]}"></div>
          <div class="field" style="margin:0;width:140px"><label>Frequency</label><input type="text" value="${t[3]}"></div>
          <button class="btn sm ghost" onclick="toast('Tier ${t[0]} saved')">${ic('check')}</button></div>`).join('')}
      <div class="banner info" style="margin-top:8px">${ic('info')}<div class="tx">Carried-forward doctors missed in prior periods are auto-flagged as priority in the next plan (§3.1).</div></div>`});
  }
  if(id==='consent'){
    return panel({title:'HCP consent & channel rules',sub:'per-market · per-channel',body:`
      <div class="banner warn" style="margin-bottom:14px">${ic('lock')}<div class="tx"><b>Consent is the messaging guardrail.</b> An HCP is never messaged without consent and on a non-permitted channel. Where an HCP has not opted in, the product does not draft for or send on that channel (§3.4).</div></div>
      <div class="stk" style="gap:10px">${[['Email','Opt-in required · double opt-in for EU-aligned markets',true],['WhatsApp','Explicit opt-in · business-initiated template rules apply',true],['SMS','Opt-in required · quiet-hours enforced',true],['Voice call','Not enabled for this tenant',false]].map(c=>`
        <div class="rowedit"><span class="pill ${c[2]?'good':'neutral'}" style="width:26px;height:26px;padding:0;border-radius:8px">${ic('msg')}</span>
          <div class="stk" style="flex:1"><b style="font-size:12.5px">${c[0]}</b><span class="subtle">${c[1]}</span></div>
          <div class="toggle ${c[2]?'on':''}" onclick="this.classList.toggle('on');toast('${c[0]} ${c[2]?'':'enabled'}')"><i></i></div></div>`).join('')}</div>`});
  }
  if(id==='branding'){
    return panel({title:'Branding',sub:'client name · colours · product naming',body:`
      <div class="field"><label>Client / product display name</label><input type="text" value="Gulf Pharma — Allys Field"><span class="hint">Client-facing product names are configurable per deployment.</span></div>
      <div class="field"><label>Primary accent</label><div class="swatchrow">${['#0B6E75','#1F6FEB','#5B47D6','#B4740B','#1F8A57','#B01E63'].map((c,i)=>`<button class="swatch ${i===0?'on':''}" style="background:${c}" onclick="document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'));this.classList.add('on');toast('Accent → ${c}')"></button>`).join('')}</div><span class="hint">Drives the console accent; semantic status colours stay fixed for legibility.</span></div>
      <div class="field"><label>Logo</label><div class="rowedit" style="margin:0"><div class="rail-logo" style="width:40px;height:40px">${ic('shield')}</div><span class="mut" style="flex:1;font-size:12px">allys-mark.svg · 40×40</span><button class="btn sm" onclick="toast('Upload logo')">${ic('export')}Replace</button></div></div>
      <div class="field"><label>Default language</label><select><option>English (en)</option><option>Arabic (ar)</option></select></div>`});
  }
  if(id==='reports'){
    const cols=[{h:'Report',k:'n',cls:'strong'},{h:'Cadence',k:'cad',render:r=>`<span class="mut">${esc(r.cad)}</span>`},{h:'Recipients',k:'rec',render:r=>`<span class="mut">${esc(r.rec)}</span>`},{h:'Enabled',k:'',render:()=>`<div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div>`}];
    return panel({title:'Reports & recipients',sub:'which reports · what cadence · who receives them',act:`<button class="btn sm primary" onclick="toast('Schedule report')">${ic('plus')}Schedule</button>`,pad:false,body:dtable('cfgrep',cols,REPORTS,{unit:'reports'})});
  }
  if(id==='languages'){
    return panel({title:'Languages',sub:'field languages incl. code-switching',body:`
      <p class="mut" style="margin:0 0 14px;font-size:12px">Voice capture, the knowledge base and generated content handle the configured languages natively — including English/Arabic code-switching mid-sentence (§6.1).</p>
      <div class="stk" style="gap:9px">${[['English','en · Latin',true],['Arabic','ar · RTL · code-switching',true],['French','fr','false']].map(l=>`<div class="rowedit"><span class="pill ${l[2]===true?'good':'neutral'}" style="width:26px;height:26px;padding:0;border-radius:8px">${ic('lang')}</span><div class="stk" style="flex:1"><b style="font-size:12.5px">${l[0]}</b><span class="subtle">${l[1]}</span></div><div class="toggle ${l[2]===true?'on':''}" onclick="this.classList.toggle('on')"><i></i></div></div>`).join('')}</div>`});
  }
  if(id==='rules'){
    return panel({title:'Compliance rules',sub:'PV routing · off-label boundaries · disclaimers · jurisdiction',body:`
      <div class="field"><label>Data residency / jurisdiction</label><select><option>United Arab Emirates (UAE)</option><option>Saudi Arabia (KSA)</option><option>European Union (EU)</option></select><span class="hint">Client data stays in-jurisdiction and does not leave it (§4.5).</span></div>
      <div class="field"><label>PV routing destination</label><input type="text" value="pv-intake@gulfpharma.example · ref-ID auto-issued"></div>
      <div class="field"><label>Off-label boundary</label><div class="rowedit" style="margin:0"><div class="stk" style="flex:1"><b style="font-size:12.5px">Refuse &amp; route to Medical Affairs</b><span class="subtle">Comparative &amp; off-label questions logged and routed</span></div><div class="toggle on"><i></i></div></div></div>
      <div class="field"><label>Required disclaimer language</label><textarea rows="3">This communication contains information for healthcare professionals only. Refer to the approved prescribing information. Report adverse events to your local pharmacovigilance contact.</textarea><span class="hint">Auto-appended to every generated follow-up (§4.1).</span></div>`});
  }
  if(id==='retention'){
    return panel({title:'History retention & access',sub:'how long finalized visit history persists · who sees whose HCPs',body:`
      <div class="field"><label>Finalized visit retention</label><select><option>36 months</option><option>24 months</option><option>60 months</option></select><span class="hint">Configurable per client and market (§3.7).</span></div>
      <div class="field"><label>Access scope</label><div class="stk" style="gap:9px">${[['Rep sees own HCPs',true],['Manager sees team',true],['Cross-territory access',false],['Inherit history on handover',true]].map(a=>`<div class="rowedit" style="margin:0"><span class="mut" style="flex:1;font-size:12.5px">${a[0]}</span><div class="toggle ${a[1]?'on':''}" onclick="this.classList.toggle('on')"><i></i></div></div>`).join('')}</div></div>
      <div class="banner info">${ic('lock')}<div class="tx">Records lock after finalization; corrections are visible, timestamped amendments — never overwrites.</div></div>`});
  }
  // generic surfaces (materials, tas, hcp, crm, channels)
  const generic={
    materials:['Approved materials','MLR-validated knowledge base · visual aids · studies · disclaimers','book','41 approved assets · 3 pending MLR'],
    tas:['Therapeutic areas','Relevant TAs and indications','branch','5 areas · 12 indications'],
    hcp:['HCP profiles','Real doctor profiles for role-play & prep','users','262 profiles · objections, history, competitors'],
    crm:['CRM target & mode','Veeva / OCE / other · API or copy-paste fallback','refresh','Veeva CRM · API (validated)'],
    channels:['Messaging channels','Which HCP follow-up channels are enabled','msg','Email · WhatsApp · SMS enabled']
  }[id];
  if(id==='materials'){
    const mats=[['MoA animation — Cardovyn','Visual aid','Approved','p.4'],['HbA1c 24-week leave-behind','Leave-behind','Approved','—'],['Renal safety study summary','Study','Approved','—'],['Dermavia patient card','Leave-behind','Pending MLR','—'],['Pulmoease dosing guide','Visual aid','Approved','p.2']];
    const cols=[{h:'Asset',k:0,cls:'strong',render:r=>`<div class="cellface"><span class="mini-av" style="border-radius:7px">${ic('book')}</span>${esc(r[0])}</div>`},{h:'Type',k:1,render:r=>`<span class="tag">${esc(r[1])}</span>`},{h:'MLR status',k:2,render:r=>statusPill(r[2]==='Approved'?'Active':'Draft')},{h:'Ref',k:3,render:r=>`<span class="mono subtle">${esc(r[3])}</span>`},{h:'',k:'',render:()=>`<button class="btn sm ghost" onclick="event.stopPropagation();toast('Preview asset')">${ic('eye')}</button>`}];
    return panel({title:generic[0],sub:generic[3],act:`<button class="btn sm primary" onclick="toast('Upload for MLR')">${ic('plus')}Upload</button>`,pad:false,body:dtable('mats',cols,mats,{select:true,bulk:[{i:'check',t:'Approve'},{i:'export',t:'Export'}],unit:'assets'})});
  }
  return panel({title:generic[0],sub:generic[3],act:`<button class="btn sm primary" onclick="toast('Add ${generic[0]}')">${ic('plus')}Add</button>`,
    body:`<div class="banner info" style="margin-bottom:14px">${ic(generic[2])}<div class="tx">${generic[1]}.</div></div>`
      +(id==='hcp'?panel({cls:'',body:hbars([{l:'Tier A',v:38,color:'var(--good)'},{l:'Tier B',v:104,color:'var(--warn)'},{l:'Tier C',v:120,color:'var(--muted)'}],{lw:80})}).replace('class="panel ','class="panel" style="box-shadow:none" data-x="'):'')
      +`<div class="def" style="grid-template-columns:180px 1fr;gap:10px 16px;margin-top:6px">
        ${id==='tas'?'<dt>Cardiology</dt><dd>Hypertension · Heart failure</dd><dt>Neurology</dt><dd>Focal seizures</dd><dt>Dermatology</dt><dd>Plaque psoriasis</dd><dt>Respiratory</dt><dd>COPD maintenance</dd><dt>Endocrinology</dt><dd>Type 2 diabetes</dd>':''}
        ${id==='crm'?'<dt>System</dt><dd>Veeva CRM</dd><dt>Mode</dt><dd>API (write-back) · validated</dd><dt>Fallback</dt><dd>Guided copy-to-CRM / export</dd><dt>Confirmation</dt><dd>Every write requires explicit rep confirmation (§3.4)</dd>':''}
        ${id==='channels'?'<dt>Email</dt><dd>Enabled · templated follow-ups</dd><dt>WhatsApp</dt><dd>Enabled · business templates</dd><dt>SMS</dt><dd>Enabled · quiet-hours enforced</dd><dt>Auto-send</dt><dd>Never — rep is always sender of record</dd>':''}
        ${id==='hcp'?'<dt>Total profiles</dt><dd>262</dd><dt>With objection history</dt><dd>241</dd><dt>Role-play ready</dt><dd>229</dd><dt>Competitor mapped</dt><dd>198</dd>':''}
      </div>`});
}

/* ============================================================
   SCREEN · DESIGN SYSTEM  (+ empty / error / loading states)
   ============================================================ */
SCREENS.design=function(){
  const swatches=[['Brand / accent',[['--brand','#0B6E75','Primary'],['--brand-500','#12909A','Interactive'],['--brand-400','#1FA9B4','Bright'],['--brand-tint','#E4F1F2','Tint']]],
    ['Neutrals (blue-biased slate)',[['--ink','#101822','Ink'],['--muted','#5C6C7C','Muted'],['--line','#E2E8EC','Line'],['--bg','#F4F6F8','Ground']]],
    ['Status (reserved)',[['--good','#1F8A57','Compliant'],['--warn','#B4740B','Off-label'],['--crit','#C43B33','Critical'],['--info','#2C64C9','Info']]],
    ['Governance & data-viz',[['--viol','#6C4FD1','Competitive'],['--pv','#B01E63','PV signal'],['--c1','#0E9BA6','Series 1'],['--c2','#6C5CE7','Series 2']]]];
  return phead({title:'Design System',
    sub:'The component library and tokens behind the console. Built for a dense, regulated back-office: slate neutrals with a petrol-teal accent, reserved semantic colours, tabular numerics, and a validated categorical chart palette.',
    act:`<button class="btn" onclick="toggleTheme()">${ic('sun')}Toggle theme</button><button class="btn" onclick="toast('Tokens exported')">${ic('download')}Tokens</button>`})
  + `<div class="sec-t">Colour tokens</div>`
  + `<div class="grid g-4">`+swatches.map(([t,items])=>panel({title:t,body:`<div class="grid g-2" style="gap:8px">${items.map(([v,hex,n])=>`<div class="ds-sw"><div class="cap" style="background:var(${v})"></div><div class="meta"><b>${n}</b><code>${hex}</code></div></div>`).join('')}</div>`})).join('')+`</div>`
  + `<div class="banner info" style="margin-top:14px">${ic('info')}<div class="tx"><b>Categorical chart palette is validated, not eyeballed.</b> Six-slot fixed order (teal · violet · amber · green · blue · pink); assigned by entity, never cycled; every chart ships a legend + labels so identity is never colour-alone. Status colours are reserved and never used as a series hue.</div></div>`
  + `<div class="sec-t">Typography</div>`
  + panel({body:`<div class="type-row"><span class="lbl">Display / H1</span><span style="font-size:26px;font-weight:750;letter-spacing:-.02em">Manager Dashboard</span></div>
     <div class="type-row"><span class="lbl">Section</span><span style="font-size:13px;font-weight:650">Team overview</span></div>
     <div class="type-row"><span class="lbl">Body</span><span style="font-size:13px">Coverage, adherence and CRM completion across your first line.</span></div>
     <div class="type-row"><span class="lbl">Label · caps</span><span style="font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">Representative</span></div>
     <div class="type-row"><span class="lbl">Data · mono</span><span class="mono num" style="font-size:15px">PV-2026-0847 · 99.2% · 3.1h</span></div>
     <p class="mut" style="margin:12px 0 0;font-size:11.5px">System UI stack for native desktop feel + <code class="mono">tabular-nums</code> everywhere digits align. A monospace face carries reference IDs, timestamps and confidence scores so columns line up.</p>`})
  + `<div class="sec-t">Components</div>`
  + `<div class="grid g-2">`
    +panel({title:'Buttons',body:`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn primary">${ic('check')}Primary</button><button class="btn">Secondary</button><button class="btn ghost">Ghost</button><button class="btn danger">${ic('x')}Danger</button><button class="btn sm">Small</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${statusPill('Compliant')}${statusPill('Off-Label Refused')}${statusPill('PV Signal')}${statusPill('Competitive Mention')}<span class="tier A">A</span><span class="tier B">B</span><span class="tier C">C</span></div>`})
    +panel({title:'KPI tile',body:kpi({icon:'route',label:'Coverage',val:82,unit:'%',delta:4,sub:'vs last cycle',target:90,spark:[71,74,72,78,80,79,82],sparkTone:'good'})})
    +panel({title:'Data cells',body:`<div class="stk" style="gap:12px">${cbar(94)}${cbar(76)}${cbar(63)}<div style="display:flex;align-items:center;gap:10px">${ring(88,{size:34,sw:5,fs:11})}${ring(64,{size:34,sw:5,fs:11})}${ring(48,{size:34,sw:5,fs:11})}<span class="mut" style="font-size:11px">readiness rings</span></div></div>`})
    +panel({title:'Banners',body:`<div class="stk" style="gap:8px"><div class="banner pv">${ic('shield')}<div class="tx">PV — human-in-the-loop required</div></div><div class="banner warn">${ic('alert')}<div class="tx">2 recaps overdue &gt;48h</div></div><div class="banner info">${ic('info')}<div class="tx">Readiness is a coaching signal, not a score</div></div></div>`})
  +`</div>`
  + `<div class="sec-t">Empty · loading · error states</div>`
  + `<div class="grid g-3">`
    +panel({title:'Empty state',pad:false,body:state({icon:'empty',title:'No competitive mentions yet',msg:'When reps capture competitor references in debriefs, they’ll route here automatically.',act:`<button class="btn sm" onclick="go('marketing')">View routed intelligence</button>`})})
    +panel({title:'Loading state',pad:false,body:`<div style="padding:16px"><div class="skel" style="height:14px;width:60%;margin-bottom:10px"></div><div class="skel" style="height:11px;width:90%;margin-bottom:8px"></div><div class="skel" style="height:11px;width:80%;margin-bottom:16px"></div><div class="skel" style="height:64px;border-radius:10px"></div><div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;color:var(--muted);font-size:12px"><span class="dots"><i></i><i></i><i></i></span>Generating report…</div></div>`})
    +panel({title:'Error state',pad:false,body:state({err:true,icon:'alert',title:'CRM sync unavailable',msg:'Veeva API didn’t respond. Captured recaps are queued and will sync on reconnect — nothing is lost.',act:`<button class="btn sm" onclick="toast('Retrying CRM sync…')">${ic('refresh')}Retry sync</button>`})})
  +`</div>`
  + `<div class="banner info" style="margin-top:20px">${ic('info')}<div class="tx"><b>One design language, two surfaces.</b> This console is the deliberate opposite of the field PWA — dense, multi-panel, keyboard-driven — but shares the compliance posture, status vocabulary and knowledge-base grounding that make the product provably safe end to end.</div></div>`;
};
</script>
<script id="app-boot">
/* ============================================================
   BOOT
   ============================================================ */
(function(){
  renderProfileTriggers();renderProfileMenu();
  buildNav(USER.home);CURRENT=USER.home;
  // initial render (no artificial skeleton on first paint)
  $('#crumbTitle').textContent=TITLES[USER.home].t;
  $('#crumbGrp').innerHTML=`${TITLES[USER.home].grp} ${ic('arrowr')} `;
  $('#content').innerHTML='<div class="page">'+SCREENS[USER.home]()+'</div>';
  window.addEventListener('resize',closeProfile);
  // keyboard: ⌘K focuses search, Esc closes drawer
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const s=document.querySelector('.topbar .search input');if(s)s.focus();}
    if(e.key==='Escape')closeDrawer();
  });
})();
</script>
</body>
</html>
